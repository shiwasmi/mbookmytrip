apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dev-mbookmytrip-hpa
  namespace: dev-mbookmytrip
  labels:
    env: dev-mbookmytrip
    app: mbookmytrip
    layer: frontend
spec:
  minReplicas: 1
  maxReplicas: 5
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mbookmytrip
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80