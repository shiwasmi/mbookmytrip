apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dev-mbookmytrip-ingress
  namespace: dev-mbookmytrip
  labels:
    env: dev-mbookmytrip
    app: mbookmytrip
    layer: frontend
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: dev-mbookmytrip.cloudcortex.in
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: dev-mbookmytrip-service
                port:
                  number: 8080
